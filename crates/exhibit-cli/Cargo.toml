[package]
name = "exhibit-cli"
version.workspace = true
edition.workspace = true

[[bin]]
name = "exhibit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
exhibit-core = { version = "0.1.0", path = "../exhibit-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3.27.0"
