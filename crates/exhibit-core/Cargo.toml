[package]
name = "exhibit-core"
version.workspace = true
edition.workspace = true

[dependencies]
keyring = "4.2.0"
regex = "1.13.2"
rusqlite = { version = "0.43.0", features = ["bundled", "functions"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sevenz-rust2 = { version = "0.25.0", default-features = false }
sha2 = "0.11.1"
strsim = "0.11.1"
unicode-normalization = "0.1.26"
ureq = "3.5.2"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Globalization", "Win32_Storage_FileSystem"] }
