[package]
name = "exhibit-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "exhibit-app"
path = "src/main.rs"

[dependencies]
exhibit-core = { version = "0.0.4", path = "../exhibit-core" }
exhibit-mcp = { version = "0.0.4", path = "../exhibit-mcp" }
exhibit-services = { path = "../exhibit-services" }
notify = "9.0.0"
qrcode = { version = "0.15.0", default-features = false, features = ["svg"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.7", features = ["protocol-asset"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
tauri-build = { version = "2.7.6", features = [] }

[dev-dependencies]
rusqlite = { version = "0.43.0", features = ["bundled"] }
tempfile = "3.27.0"
