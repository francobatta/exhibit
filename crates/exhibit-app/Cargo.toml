[package]
name = "exhibit-app"
version.workspace = true
edition.workspace = true

[[bin]]
name = "exhibit-app"
path = "src/main.rs"

[dependencies]
exhibit-core = { version = "0.1.0", path = "../exhibit-core" }
notify = "8.2.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2.12.5", features = ["protocol-asset"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dev-dependencies]
rusqlite = { version = "0.42.0", features = ["bundled"] }
tempfile = "3.27.0"
